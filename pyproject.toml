[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "env-guard"
version = "0.1.0"
description = "Validate .env files against a schema: required keys, formats, and no real secrets committed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Manoj Kumar Kagitha" }]

[project.scripts]
env-guard = "envguard.cli:main"

[tool.setuptools.packages.find]
include = ["envguard*"]
